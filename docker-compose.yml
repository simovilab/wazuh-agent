# AGENTE WAZUH DOCKER
services:
  wazuh-agent:
    container_name: wazuh-agent
    image: wazuh/wazuh-agent:4.14.1
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
        reservations:
          memory: 512M
          cpus: "1.0"
    environment:
      - WAZUH_MANAGER_SERVER=${WAZUH_MANAGER_SERVER}
      - WAZUH_AGENT_NAME=${WAZUH_AGENT_NAME}
      - WAZUH_MANAGER_SERVER_PORT=${WAZUH_MANAGER_SERVER_PORT}
      #- WAZUH_HOST_PROC=/host_proc
      #- WAZUH_HOST_SYS=/host_sys
      #- WAZUH_HOST_DEV=/host_dev
      #- WAZUH_HOST_MEMINFO=/host_proc_meminfo
    volumes:
      - ./wazuh-agent/conf/wazuh-agent.conf:/etc/ossec.conf
      - /var/lib/lxcfs/proc:/proc:ro
      - /var/lib/lxcfs/sys:/sys:ro
      - /var/lib/lxcfs/proc/meminfo:/proc/meminfo:ro
      #- /dev:/dev:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      #- /proc/meminfo:/host_proc_meminfo:ro
